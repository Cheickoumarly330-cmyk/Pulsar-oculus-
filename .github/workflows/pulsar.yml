name: PULSAR Auto-Scan
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run PULSAR
        run: python pulsar_bounty.py .
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: pulsar-reports
          path: |
            rapport.json
            rapport_SHERLOCK.md
            rapport.txt
